<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Drawing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1><a href="index.html">HAN SUMIN</a></h1>

<h2>DRAWING / 2025</h2>

<div class="gallery">
    <img src="images/2025_drawing/2025_d01.JPG">
    <img src="images/2025_drawing/2025_d02.JPG">
    <img src="images/2025_drawing/2025_d03.JPG">
    <img src="images/2025_drawing/2025_d04.JPG">
    <img src="images/2025_drawing/2025_d05.jpg">
    <img src="images/2025_drawing/2025_d06.JPG">
    <img src="images/2025_drawing/2025_d07.JPG">
    <img src="images/2025_drawing/2025_d08.jpeg">
    <img src="images/2025_drawing/2025_d09.JPG">
    <img src="images/2025_drawing/2025_d10.JPG">
    <img src="images/2025_drawing/2025_d11.JPG">
</div>

<div class="lightbox" id="lightbox">
    <span class="close">×</span>
    <img id="lightbox-img">
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");

images.forEach(function(img) {
    img.addEventListener("click", function() {
        lightbox.style.display = "flex";
        lightboxImg.src = img.src;
    });
});

closeBtn.addEventListener("click", function() {
    lightbox.style.display = "none";
});

lightbox.addEventListener("click", function(event) {
    if (event.target === lightbox) {
        lightbox.style.display = "none";
    }
});
</script>

</body>
</html>
