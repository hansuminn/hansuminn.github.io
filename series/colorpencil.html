<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Color Pencil - Han Sumin</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body class="series-page">


    <header class="series-header">

        <a
            class="series-name"
            href="../index.html"
        >

            <div class="name-ko">
                한수민
            </div>

            <div class="name-en">
                Han Sumin
            </div>

        </a>


        <div class="series-category">
            DRAWING / COLOR PENCIL
        </div>

    </header>


    <main class="series-gallery">


        <!-- 최신 작품 -->

        <figure class="artwork">

            <img
                src="../images/drawing/colorpencil/colorpencil_05.jpg"
                alt=""
                data-title="Portrait"
                data-caption="21 August 2026 - Color pencil on paper 21 × 29.7 cm"
            >

        </figure>


        <figure class="artwork">

            <img
                src="../images/drawing/colorpencil/colorpencil_04.jpg"
                alt=""
                data-title=""
                data-caption="21 August 2026 - Color pencil on paper 21 × 29.7 cm"
            >

        </figure>


        <figure class="artwork">

            <img
                src="../images/drawing/colorpencil/colorpencil_03.jpg"
                alt=""
                data-title=""
                data-caption="21 August 2026 - Color pencil on paper 21 × 29.7 cm"
            >

        </figure>


        <figure class="artwork">

            <img
                src="../images/drawing/colorpencil/colorpencil_02.jpg"
                alt=""
                data-title=""
                data-caption="21 August 2026 - Color pencil on paper 21 × 29.7 cm"
            >

        </figure>


        <figure class="artwork">

            <img
                src="../images/drawing/colorpencil/colorpencil_01.jpg"
                alt=""
                data-title=""
                data-caption="21 August 2026 - Color pencil on paper 21 × 29.7 cm"
            >

        </figure>


    </main>



    <!-- =================================
         LIGHTBOX
    ================================== -->

    <div
        class="lightbox"
        id="lightbox"
    >


        <button
            class="lightbox-close"
            id="lightbox-close"
            type="button"
            aria-label="Close"
        >
            ×
        </button>


        <div class="lightbox-content">


            <div class="slider-window">

                <div
                    class="slider-track"
                    id="slider-track"
                >


                    <!-- 이전 -->

                    <div class="slide">

                        <img
                            class="lightbox-image"
                            id="prev-image"
                            src=""
                            alt=""
                        >

                    </div>


                    <!-- 현재 -->

                    <div class="slide">

                        <img
                            class="lightbox-image"
                            id="lightbox-image"
                            src=""
                            alt=""
                        >

                    </div>


                    <!-- 다음 -->

                    <div class="slide">

                        <img
                            class="lightbox-image"
                            id="next-image"
                            src=""
                            alt=""
                        >

                    </div>


                </div>

            </div>


            <div
                class="lightbox-caption"
                id="lightbox-caption"
            ></div>


            <div
                class="lightbox-thumbnails"
                id="lightbox-thumbnails"
            ></div>


        </div>

    </div>


    <script src="../script.js"></script>


</body>

</html>
